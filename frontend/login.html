<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">SkillSphere</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container">
            <h2>Login to SkillSphere</h2>

            <!-- Login form: no real authentication yet, handled in later steps -->
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit" class="btn btn-primary form-btn">Login</button>
            </form>

            <p class="form-link">Don't have an account? <a href="register.html">Register here</a></p>
            <p class="form-link"><a href="index.html">← Back to Home</a></p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
