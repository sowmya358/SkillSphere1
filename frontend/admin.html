<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>SkillSphere Admin</h1>

    <div id="adminLoginBox" class="card">
        <h3>Admin Login</h3>
        <form id="adminLoginForm">
            <input type="email" id="adminEmail" placeholder="Admin email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>

    <div id="adminPanel" style="display:none">
        <p>Logged in as <strong id="adminName"></strong>
            <button id="adminLogout" class="btn btn-secondary">Log out</button></p>

        <div class="card">
            <h3>All Users</h3>
            <table border="1" cellpadding="6">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Credits</th><th>Role</th><th>Skills</th></tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>All Skills</h3>
            <table border="1" cellpadding="6">
                <thead>
                    <tr><th>ID</th><th>Skill</th><th>Category</th><th>Description</th><th>Teacher</th><th></th></tr>
                </thead>
                <tbody id="skillsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
