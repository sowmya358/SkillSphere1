<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">SkillSphere</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container">
            <h2>Create Your SkillSphere Account</h2>

            <!-- Registration form: no database functionality yet, handled in later steps -->
            <form id="registerForm">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>

                <button type="submit" class="btn btn-primary form-btn">Register</button>
            </form>

            <p class="form-link">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
